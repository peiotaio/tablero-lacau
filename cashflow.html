  cashflow.html v1 (30/09/2026) — LA WEB NUEVA «DÓNDE TE PARÁS». Vive AL LADO de tabla.html (no la
  reemplaza ni la toca). Es la maqueta 05 Tablero web/MAQUETA_tablero_v24_2026-09-29.html llevada a
  datos reales: mismo diseño F2 «Grafito y trigo» (Manrope, fondo papel), mismos textos, mismas
  pestañas (Saldo proyectado · Cash Flow Hoy · Qué cambió · Granos · Estado de la web) y el mismo
  comportamiento del selector «Parado el / Mirando al / Contra lo cargado hoy».

  DE DÓNDE SALEN LOS NÚMEROS (edge function `tabla` v9, misma URL que tabla.html, elegida por ?vista=):
    * ?vista=hoy[&hoy=]                     lo fijo de Saldo proyectado (fechas clave, fin de mes, día 10,
                                            punto de partida, mínimos) y la matriz de Cash Flow Hoy.
    * ?vista=dondeteparas&parado=&contra=&mira=[&hoy=][&rubro=]
                                            el selector: totales, por rubro, cortes, lunes a lunes, avisos.
    * ?vista=entre&a=&b=&fecha=[&todos=1]   los comprobantes que más movieron entre dos bajadas.
    * ?vista=contraste                      el sello de arriba (el contraste del día con administración).
  TODO viene en millones con 2 decimales y con los avisos ya escritos: acá NO se divide, NO se redondea
  y NO se calculan fechas. La página solo pinta; las columnas de diferencia vienen de la función
  (cambio, cambio_vs_hoy, cambio_vs_anterior).

  DECISIONES DE PEIO (30/09/2026):
    1. «Qué cambió» abre con «Parado el» = hoy en las dos puntas (hoy contra hoy, todo en 0,00).
       Es un estado válido, no un error.
    2. En Saldo proyectado, el bloque «Fecha elegida» y la franja «contra el lunes» se recalculan con
       el selector (bajada «Parado el», fecha «Mirando al», bajada «contra»). Nada queda fijo a hoy.
    3. En celular (< 600 px) la columna «Tipo» del cuadro por rubro se esconde.

  LA CLAVE: igual que tabla.html v9.1. Se acepta por ?k= (link para compartir; se saca de la barra ya
  mismo con history.replaceState) o por #k= (favoritos), y se recuerda en el aparato (localStorage,
  clave cf_clave, la misma que tabla.html). Nunca está escrita acá (el watchdog del bot tiene un guardia).
  #prueba=1 o ?prueba=1: las consultas van con &origen=prueba (probar_cashflow.mjs y el watchdog).
  #hoy=AAAA-MM-DD o ?hoy=: día congelado para las pruebas (se pasa a las vistas hoy y dondeteparas).
  Deep link: #tab=cambio&desde=&hasta=&mira=&rubro= (Qué cambió) · #pdesde=&phasta=&pmira= (Saldo proyectado).

  v1.1 (30/09/2026, PROMPT 3) — GRANOS y ESTADO DE LA WEB con datos:
    * ?vista=granos[&hoy=]   stock, gastos comerciales (con fletes del 16) y cosecha por grano y por mes, leídos
                             del detalle de la bajada de hoy con las reglas de la maqueta. Las series por grano
                             (y «Todos») vienen ya sumadas: acá se elige el grano y se pinta. Lo que no se pudo
                             leer viene en no_leidos y se lista aparte; nunca se completa.
    * ?vista=estado[&hoy=]   los tres controles de la mañana (contraste con administración, integridad del
                             registro, incidentes abiertos) y la bitácora de los últimos 10 días hábiles.
    Deep link: #tab=granos&grano=Soja · #tab=fiar. #hoy= también congela estas dos vistas.
  Prueba de humo: probar_cashflow.mjs (mismo repo).
-->

<script>
(function () {
  var API = "https://htxtrmfmrzvgukqzjjnh.supabase.co/functions/v1/tabla";
  var hash = new URLSearchParams(location.hash.slice(1));
  var query = new URLSearchParams(location.search);
  var app = document.getElementById("app");

  // --- la clave: #k= (favoritos) > ?k= (link para compartir) > la recordada en el aparato ----
  var LS = "cf_clave";
  var leerGuardada = function () { try { return localStorage.getItem(LS); } catch (e) { return null; } };
  var guardar = function (v) { try { localStorage.setItem(LS, v); } catch (e) { /* privado / bloqueado */ } };
  var olvidar = function () { try { localStorage.removeItem(LS); } catch (e) { /* idem */ } };
  var k = hash.get("k"), kOrigen = k ? "hash" : null;
  if (!k && query.get("k")) { k = query.get("k"); kOrigen = "query"; }
  if (!k) { k = leerGuardada(); kOrigen = k ? "memoria" : null; }
  // ?k= no se queda en la barra: se saca ya mismo (el resto del deep link vive en el hash).
  if (query.has("k")) {
    query.delete("k");
    var restoQuery = query.toString();
    try { history.replaceState(null, "", location.pathname + (restoQuery ? "?" + restoQuery : "") + location.hash); } catch (e) { /* noop */ }
  }
  if (k) guardar(k);
  var esFecha = function (s) { return !!s && /^\d{4}-\d{2}-\d{2}$/.test(s); };
  // #prueba=1: consultas automáticas (probar_cashflow.mjs, watchdog); la función las anota aparte.
  var prueba = hash.get("prueba") === "1" || query.get("prueba") === "1";
  // #hoy=: día congelado para las pruebas (se pasa a las vistas hoy y dondeteparas).
  var hoyParam = esFecha(hash.get("hoy")) ? hash.get("hoy") : (esFecha(query.get("hoy")) ? query.get("hoy") : null);

  // --- utilidades (las de la maqueta) --------------------------------------------
  var p2 = function (n) { return (n < 10 ? "0" : "") + n; };
  var iso = function (y, m, d) { return y + "-" + p2(m) + "-" + p2(d); };
  var ms = function (s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); };
  var suma = function (s, n) { var t = new Date(ms(s) + n * 864e5); return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
  var dow = function (s) { return new Date(ms(s)).getUTCDay(); };
  var DIA3 = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  var DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  var MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  var MES3 = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  var corta = function (s) { return s ? s.slice(8, 10) + "/" + s.slice(5, 7) : "—"; };
  var larga = function (s) { return s ? corta(s) + "/" + s.slice(0, 4) : "—"; };
  var conDia = function (s) { return s ? DIA3[dow(s)] + " " + larga(s) : "—"; };

    } else {

            '<div class="cf-row cf-g4 cf-head"><div>Comprobante</div><div class="cf-hide-sm" style="text-align: left;">Rubro</div><div>Qué pasó (fecha de cobro o pago)</div><div>Efecto al ' + cMira + "</div></div>" +
            e.comprobantes.map(function (c) {
              return '<div class="cf-row cf-g4"><div style="white-space: normal;"><div style="font-weight: 500;">' + esc(c.descripcion) + '</div><div style="font-size: 12px; color: #5D6166;">' + esc(c.referente) + "</div></div>" +
                '<div class="cf-hide-sm" style="text-align: left; white-space: normal; font-size: 13px; color: #5D6166;">' + esc(c.rubro.slice(0, 2) + " · " + (c.etiqueta || c.nombre)) + "</div>" +

      '<div class="cf-row ' + (rs ? "cf-gl4" : "cf-gl3") + ' cf-head"><div>Parado el</div><div>Saldo al ' + cMira + "</div><div>Cambio vs. lunes anterior</div>" + (rs ? '<div style="white-space: normal;">' + esc(rubEt) + "</div>" : "") + "</div>";

  // ---- Cash Flow Hoy ----

    h += '<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; background: #FFFFFF; border: 1px solid #D6CFC1; border-radius: 12px;">' +
      '<span style="font-size: 14px;">· = sin movimiento. «Entra − sale en el mes» de ' + MESES[+H.hoy.slice(5, 7) - 1] + " incluye el punto de partida de hoy; la fila Bancos de " + MESES[+H.hoy.slice(5, 7) - 1] + " es el saldo conciliado de hoy más los movimientos bancarios hasta el fin del mes. Stock, gastos comerciales y cosecha por grano: en la pestaña Granos.</span>" +

    if (todos && B.totales.flete16_sin_grano !== null && Math.abs(B.totales.flete16_sin_grano) >= 0.005) notas.push("De esos fletes, " + fmt(B.totales.flete16_sin_grano) + " MM no dicen el grano: solo aparecen en «Todos».");
    h += notas.map(function (t) { return '<p class="cf-gr-nota" style="margin: 8px 10px 4px; font-size: 12px; color: #5D6166;">' + esc(t) + "</p>"; }).join("") + '<div style="height: 6px;"></div></div>';

      t1 = v === "CIERRA" ? "Coincide con administración" : (c.estado === "revisar" ? "Hay algo para revisar (" + v.toLowerCase() + ")" : "No coincide con administración (" + (v || "sin veredicto").toLowerCase() + ")");
      var celdas = c.celdas_revisar === null ? "s/d celdas a revisar" : c.celdas_revisar === 0 ? "ninguna celda a revisar" : c.celdas_revisar === 1 ? "1 celda a revisar" : c.celdas_revisar + " celdas a revisar";
      b1 = '<p class="cf-num">Contra la planilla de Giorgi (' + esc(corta(c.fecha)) + (c.planilla_hora ? ", " + esc(c.planilla_hora) : "") + "): diferencia " + fmt(c.interior) + " MM sin contar bancos, " + celdas +
        ". Bancos da " + fmtS(c.bancos) + " distinto por la conciliación del día; bancos no se compara." + (c.al_dia ? "" : " Es el último contraste guardado: el de hoy todavía no está.") + "</p>" +
        (c.nota ? '<details><summary>Nota del contraste</summary><p style="margin-top: 6px;">' + esc(c.nota) + "</p></details>" : "");
    }
    // 2. Integridad
    var I = E.integridad, q = I.chequeo, t2, b2;
    if (!q) { t2 = "Los datos guardados no se controlaron"; b2 = '<p class="cf-num">Desde el ' + esc(corta(I.primera || "")) + " se guardaron los datos de " + I.fotos + " días. No hay ningún chequeo del registro guardado.</p>"; }
    else if (I.sin_modificar && q.color !== "ROJO") {
      t2 = "Los datos guardados están bien";
      b2 = '<p class="cf-num">Desde el ' + esc(corta(I.primera)) + " se guardaron los datos de " + I.fotos + " días; ninguno se modificó después. " +
        (q.es_de_hoy ? "La de hoy se controló a las " + esc(q.hora) + "." : "El último control es del " + esc(corta(q.fecha)) + " a las " + esc(q.hora) + ".") +
        (q.color === "AMBAR" ? " El chequeo quedó en ámbar: " + esc(q.resumen) : "") + "</p>";
    } else {
      t2 = "Hay que revisar los datos guardados";
      b2 = '<p class="cf-num">El control del ' + esc(corta(q.fecha)) + " a las " + esc(q.hora) + " no cerró: " + (q.hash_mal ? q.hash_mal + " foto(s) con el hash cambiado. " : "") + (q.regresion_dif ? q.regresion_dif + " diferencia(s) al recalcular las últimas fotos. " : "") + (q.referencia_dif ? q.referencia_dif + " diferencia(s) contra la foto de referencia. " : "") + "Detalle: " + esc(q.resumen) + "</p>";
    }
    // 3. Incidentes
    var N = E.incidentes;
    var b3 = N.abiertos.length ? '<ul style="margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 4px;">' + N.abiertos.map(function (i) {
      return "<li>" + esc(i.sintoma) + ' <span class="cf-num" style="color: #5D6166; font-size: 12px;">(' + esc(String(i.severidad).toLowerCase()) + ", " + esc(corta(i.abierto || i.fecha)) + (i.abierto_hora ? " " + esc(i.abierto_hora) : "") + (i.veces > 1 ? ", visto " + i.veces + " veces" : "") + ")</span></li>";
    }).join("") + "</ul>" : "<p>Ningún incidente abierto.</p>";
    if (N.abiertos.length && c && String(c.veredicto || "").toUpperCase() === "CIERRA" && !N.alarmas) b3 += '<p class="cf-gris" style="font-size: 13px;">Igual coincide con administración.</p>';
    h += '<div class="cf-checks" id="cf-est-checks">' + card("cf-est-contraste", c ? c.estado : "sin_dato", t1, b1) + card("cf-est-integridad", I.estado, t2, b2) + card("cf-est-incidentes", N.estado, N.titulo, b3) + "</div>";
    // Bitácora
    h += '<div class="cf-card2" id="cf-est-bitacora"><h3>Últimos 10 días hábiles</h3><div class="cf-bit">' + E.bitacora.map(function (b) {
      return '<div class="' + esc(b.estado) + '" title="' + esc(b.nota || "") + '"><div style="font-size: 12px;">' + esc(corta(b.fecha)) + '</div><div style="font-size: 13px; font-weight: 600;">' + esc(b.texto) + "</div></div>";
    }).join("") + "</div>";
    var raros = E.bitacora.filter(function (b) { return b.estado !== "ok"; });
    if (raros.length) {
      h += raros.map(function (b) {
        return "<details><summary>" + esc(corta(b.fecha) + ": " + b.texto) + (b.interior !== null ? " · diferencia sin bancos " + fmtS(b.interior) + " MM" : "") + (b.celdas_revisar ? " · " + b.celdas_revisar + " celdas a revisar" : "") + "</summary>" +
          '<p style="margin-top: 6px;">' + esc(b.nota || "Sin nota.") + "</p></details>";
      }).join("");
    } else {
      h += '<p style="font-size: 13px; color: #5D6166;">Los diez días coinciden con administración.</p>';
    }
    h += "</div>";
    h += '<div class="cf-card2"><h3>Cómo se arma el número</h3><ul>' +
      "<li>Se lee desde hoy, igual que administración: lo vencido y no resuelto se suma al mes en curso.</li>" +
      "<li>Bancos es el saldo conciliado del día: no tiene comprobante detrás y no se usa para comparar.</li>" +
      "<li>No entran los rubros " + esc(E.rubros_fuera.slice(0, -1).join(", ") + " y " + E.rubros_fuera.slice(-1)) + ": van por fuera del cash flow (los fletes del 16 se ven en Granos).</li>" +
      "<li>Hasta qué fecha se proyecta lo decide administración; la web la sigue sola.</li>" +
      "<li>Los datos de un día ya guardado no cambian nunca: si cambiaran, algo nuestro se rompió y salta la alarma.</li></ul></div>";
    return h + "</section>";
  }

  // ---- ¿Cómo se lee? (texto de la maqueta) ----
  function ayuda() {
    if (!S.help) return "";
    return '<div class="cf-help"><div role="dialog" aria-modal="true" aria-labelledby="cf-help-t">' +
      '<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;"><h2 id="cf-help-t" style="font-size: 26px;">Cómo se lee</h2>' +
      '<button type="button" data-help="0" style="min-height: 44px; padding: 8px 16px; border: 1px solid #D6CFC1; background: #FFFFFF; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;">Cerrar</button></div>' +
      '<p class="cf-gris">Cada pestaña contesta una pregunta. Todo en millones de pesos (MM), con lo que tiene cargado Albor cada madrugada (el «día de carga»).</p>' +
      '<div style="display: flex; flex-direction: column; gap: 6px;"><h3>Saldo proyectado</h3>' +
      "<p>¿Cuánta plata va a haber en cada fecha? Si se cumple todo lo cargado en Albor: lo que hay hoy (bancos + vencidos) + lo que entra − lo que sale hasta ese día. Negativo = faltaría plata.</p>" +
      "<p>Fechas clave: los próximos cuatro días 10 (arrendamientos) o fines de mes, más la fecha fija (★): el 30 de noviembre. Pasado el 30/11, la fecha fija pasa al fin de febrero; pasado febrero, vuelve al 30/11. Las otras cuatro corren solas: cuando una pasa, entra la siguiente.</p>" +
      "<p>«▲ +100 contra el lunes» = para ese día, con lo cargado hoy se espera tener 100 MM más que con lo cargado el lunes.</p>" +
      "<p>«Dónde te parás»: la fecha es dónde te parás, no hacia dónde mirás. «Parado el» es el día de carga en Albor (hoy o para atrás) y «Mirando al» la fecha que querés ver, para atrás o para adelante. Si la fecha todavía no había llegado, es lo proyectado con lo cargado ese día; si ya había pasado, lo que realmente hubo (hay saldo de bancos desde el 01/09). Se compara contra lo cargado hoy; con «Comparar contra otro día» elegís otro. Es el mismo selector que en «Qué cambió».</p></div>" +
      '<div style="display: flex; flex-direction: column; gap: 4px;"><h3>Qué cambió</h3>' +
      "<p>El mismo «Dónde te parás»: «Parado el» (día de carga), «Mirando al» (la fecha que querés ver, para atrás o para adelante) y contra lo cargado hoy u otro día. Muestra el saldo a esa fecha parado en cada día, por rubro, en los días 10 y fines de mes, los comprobantes que más movieron (qué se cargó, borró o cambió de fecha en Albor) y lunes a lunes. No es plata que entró o salió: son cambios en la carga.</p></div>" +
      '<div style="display: flex; flex-direction: column; gap: 4px;"><h3>Cash Flow Hoy</h3><p>Lo que entra y sale cada mes, por rubro, según lo cargado hoy. Es la planilla de administración. Sombreado: campaña siguiente (después del 30/11).</p></div>' +
      '<div style="display: flex; flex-direction: column; gap: 4px;"><h3>Granos</h3><p>Por grano y por mes: stock a vender, gastos comerciales (con fletes) y costo de cosecha. Solo lo que está en Albor; lo que falta o no cuadra no se completa. Los fletes del rubro 16 no suman en el saldo.</p></div>' +
      '<div style="display: flex; flex-direction: column; gap: 4px;"><h3>Estado de la web</h3><p>Controles automáticos de cada mañana: si coincide con administración, si los datos guardados están bien y si hay alarmas. El punto verde de arriba los resume.</p></div>' +
      '<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #D6CFC1;"><h3>Palabras</h3><dl>' +
      "<dt>Día de carga</dt><dd>Lo que tenía cargado Albor esa madrugada. Se guarda uno por día y no se modifica nunca. «Parado el» elige cuál.</dd>" +
      "<dt>Hasta dónde se proyecta</dt><dd>Lo fija administración" + (S.hoy ? " (hoy, hasta el " + larga(S.hoy.horizonte) + ")" : "") + ".</dd>" +
      "<dt>Días 10 y fines de mes</dt><dd>El día 10 (se pagan los arrendamientos) y el último día de cada mes.</dd>" +
      "<dt>Fecha fija (★)</dt><dd>El 30/11, fin de campaña. Pasado el 30/11 pasa a ser el fin de febrero; pasado febrero, vuelve al 30/11.</dd>" +
      "<dt>Comprometido</dt><dd>Hay un documento con un tercero: factura, contrato, orden de compra, arrendamiento.</dd>" +
      "<dt>Presupuesto</dt><dd>Lo carga finanzas por fórmula: otros ingresos y otros egresos. Incluye el stock de granos a vender.</dd>" +
      "<dt>Bancos</dt><dd>Saldo conciliado del día. No tiene comprobante detrás.</dd>" +
      "<dt>Girasol AO</dt><dd>Girasol alto oleico; va aparte del girasol común.</dd>" +
      "<dt>MM</dt><dd>Millones de pesos.</dd></dl></div></div></div>";
  }

  // --- render -------------------------------------------------------------------------
  function render() {
    var act = document.activeElement && document.activeElement.id;
    var y = window.scrollY;
    var h = '<div class="cf-wrap">' + cabecera() + tabs();
    if (S.hoyError) h += errorHTML(S.hoyError);
    else if (!S.hoy) h += esqueleto();
    else if (S.tab === "venimos") h += saldoProyectado();
    else if (S.tab === "cambio") h += queCambio();
    else if (S.tab === "hecho") h += cashFlowHoy();
    else if (S.tab === "granos") h += granos();
    else h += estadoWeb();
    h += "<footer>Datos de Albor de cada madrugada · cashflow.html v1.1 (30/09/2026) · Los datos de un día ya guardado no cambian nunca. " +
      'La clave del link queda recordada en este aparato. <a href="#" id="olvidar">Olvidar la clave en este aparato</a>.</footer></div>' + ayuda();
    app.innerHTML = h;
    // La leyenda «Deslizá la tabla» solo si la tabla de al lado de verdad se desliza.
    app.querySelectorAll(".cf-scroll").forEach(function (sc) {
      var l = sc.previousElementSibling;
      if (l && l.classList.contains("cf-only-sm")) { var va = sc.scrollWidth > sc.clientWidth + 2; l.style.visibility = va ? "visible" : "hidden"; l.style.height = va ? "" : "0"; l.style.padding = va ? "" : "0"; }
    });
    if (act) { var e = document.getElementById(act); if (e) e.focus({ preventScroll: true }); }
    window.scrollTo(0, y);
  }

  // --- arranque -------------------------------------------------------------------------
  if (!k) {
    app.innerHTML = '<div class="cf-wrap">' + cabecera() + '<div class="cf-aviso" role="alert" id="cf-error"><b>Falta la clave en el link.</b> ' +
      "El link completo lleva la clave (<code>?k=…</code> o <code>#k=…</code>): pedíselo a quien te lo pasó y abrilo entero. Después de la primera vez, este aparato la recuerda.</div></div>";
    return;
  }
  render();
  pedirHoy();
  pedirSello();
})();
</script>
</body>
</html>
