<!--
  cashflow.html v2 (02/10/2026) — LA WEB NUEVA COMPLETA, una sola, en uso desde ya (decisión de Peio, 02/10 17:19).
  Reemplaza a la v1.1.1 en el mismo link. Es la maqueta v2 aprobada el 01/10 (05 Tablero web/web_v2_2026-10-01/
  MAQUETA_web_v2_2026-10-01.dc.html, canvas v48) llevada a datos reales, sin framework: HTML + JS plano. La lógica
  JS de la maqueta (ctx, inicio, proy, cambio, giorgi, granos, eys, estado, crudo, notas) es la especificación del
  comportamiento; acá está reproducida función por función sobre las vistas de la edge function `tabla`.

  PANTALLAS: Inicio · Saldo proyectado · Cuadro Pekín (con «Qué cambió» y «Por motivo») · Granos · Foto Albor ·
  Dato crudo · Estado de la web · Notas. Columna lateral con las secciones de cada pantalla, sello «Albor al cierre
  del … · bajada … a las …», barra inferior de 5 en celular, «Cerrar la columna». Deep link por pantalla (#p=…).

  DE DÓNDE SALEN LOS NÚMEROS (edge function `tabla` v13, elegida por ?vista=; la clave va SIEMPRE por el encabezado
  x-cf-clave, nunca en la URL de la consulta):
    hoy · pekin · dondeteparas · entre · dias · dia · vencimientos · control · crudo · crudo_filas · granos ·
    estado · contraste · variaciones · variaciones_dias.
  TODO viene en millones con 2 decimales y con los avisos ya escritos: acá NO se divide, NO se redondea y NO se
  calculan saldos. Lo único que se resta en la página son los chips «cambió» entre dos valores que la función manda
  por separado (una columna del Pekín contra otra) y los totales por capa de Foto Albor (suma de celdas ya en MM);
  todo lo demás (diferencias, mínimos, acumulados) viene de la función. Lo que no hay va en null o con aviso en
  castellano: nunca se inventa ni se completa. Nada escrito a mano: ni cifras, ni fechas, ni listas.

  CONVENCIÓN: «carga del día D» = Albor al cierre de D = la bajada de la madrugada D+1. La web habla siempre de
  «carga»; las vistas reciben bajadas (pekin.cargas[] trae las dos fechas). «Parado el» abre en la carga del lunes
  anterior (o la anterior, si hoy es lunes).

  DISEÑO: F2 «Grafito y trigo» adaptado como la maqueta (grafito #26292C, papel #F7F4EE, trigo #AD7615; 8 roles de
  texto; títulos de cuadros y primera fila en gris). Saldo negativo en NEGRO con «−»; rojo solo para plata que sale
  o algo que empeora; verde solo para lo que entra o mejora; dorado solo para «Lo importante» / «A revisar».
  Celular < 600 px sin scroll lateral, botones ≥ 44 px.

  LA CLAVE: igual que la v1 (?k= se saca de la barra ya mismo y queda recordada en el aparato: localStorage cf_clave;
  #k= para favoritos). #prueba=1: consultas con origen=prueba (probar_cashflow.mjs y el watchdog). #hoy=AAAA-MM-DD:
  día congelado para las pruebas (se pasa a todas las vistas que lo aceptan).

  NOTAS: solo en este aparato (localStorage cf_notas, con try/catch), texto plano (siempre escapado; nunca HTML).
  Rótulo «Solo en este aparato · todavía no se comparten». Las compartidas con autor vienen con el login de Microsoft.

  LO QUE QUEDA PARA DESPUÉS (login de Microsoft / Vercel): notas compartidas con autor, «Abrir en Excel» (el archivo

  Prueba: probar_cashflow.mjs v2 (mismo repo). La v1.2.1 quedó como probar_cashflow_v1.mjs.

      '<p class="nota">' + esc(TIT[S.p]) + '. Todo en millones de pesos (MM), con lo que tiene cargado Albor al cierre de cada día (la «carga»).</p>' + (AYUDA[S.p] || "") +
      '<h3>Palabras</h3><p><b>Carga del día</b>: Albor al cierre de ese día, bajado a la madrugada siguiente. Se guarda una por día y no se modifica nunca.</p><p><b>Horizonte</b>: hasta dónde proyecta Albor; lo fija administración' + (S.hoy ? " (hoy, hasta el " + esc(larga(S.hoy.horizonte)) + ")" : "") + '.</p><p><b>Días 10 y fines de mes</b>: el día 10 (arrendamientos) y el último día de cada mes. <b>Fecha fija (★)</b>: el fin de campaña.</p><p><b>Comprometido</b>: hay un documento con un tercero. <b>Presupuesto</b>: lo carga finanzas por fórmula. <b>Bancos</b>: saldo conciliado del día.</p></div></div>';
  }
  function esqueleto() { var b = function (w, h) { return '<div class="b" style="width:' + w + ";height:" + h + 'px"></div>'; }; return '<div class="esq" id="esqueleto"><p class="cargando">Cargando la carga de hoy…</p>' + b("60%", 28) + b("100%", 70) + b("100%", 160) + b("100%", 220) + "</div>"; }
  function errorHTML(msg) { return '<div class="aviso" role="alert" id="cf-error"><b>No se pudo cargar.</b> ' + esc(msg) + " " + queHacer(msg) + ' <button type="button" class="btn btn-sm" data-reintentar="hoy" style="margin-left: 8px;">Reintentar</button></div>'; }
  function render() {
    var act = document.activeElement && document.activeElement.id;
    var y = window.scrollY;
    var cuerpo;
    if (S.hoyError) cuerpo = errorHTML(S.hoyError);
    else if (!S.hoy || !S.pekin) cuerpo = esqueleto();
    else cuerpo = { inicio: inicio, proy: proy, pekin: pekin, granos: granos, albor: albor, crudo: crudo, estado: estado, notas: notas }[S.p]();
    var h = '<div class="app">' + lateral() + '<div class="main"><div class="top"><div class="miga">Cash Flow / <b>' + esc(TIT[S.p]) + '</b></div><div class="top-der">' + selloHTML() + '<button type="button" class="ayuda-btn" data-help="1"><span>?</span><span>¿Cómo se lee?</span></button></div></div>' +
      '<div class="wrap">' + cuerpo + "<footer>Datos de Albor de cada madrugada · " + VERSION + ' · Los datos de un día ya guardado no cambian nunca. La clave del link queda recordada en este aparato. <a href="#" id="olvidar">Olvidar la clave en este aparato</a>.</footer></div></div></div>' + tabbar() + ayuda();
    app.innerHTML = h;

    // El cuadro Pekín arranca mostrando las últimas cargas (las marcadas están a la derecha): una sola vez por visita.

  }
  // Lo que necesita la pantalla abierta, si todavía no está pedido.
  function asegurar() {
    if (!S.hoy || !S.pekin) return;
    var H = S.hoy, kP = bajadaDe(S.parado), kH = H.hoy;
    if (S.p === "inicio" || S.p === "proy" || S.p === "pekin" || S.p === "estado") pedirDias();
    if (S.p === "inicio") {
      pedirDonde(kP, kH, kH);
      if (H.minimo_hasta_fija) { pedirDonde(kP, kH, H.minimo_hasta_fija.fecha); var sig = suma(H.minimo_hasta_fija.fecha, 1); if (sig > kH && sig <= H.horizonte) pedirDia(sig); }
    }
    if (S.p === "proy") {
      pedirDonde(kP, kH, S.mira);
      if (S.mira >= kH) pedirDiasHasta(S.mira);
      if (S.ab.venc && !S.vencError) pedirUna("venc", "vencimientos");
      if (S.ab.dxd && S.dxd === "dias") { pedirDiasHasta(S.mira); Object.keys(S.diaAb).forEach(function (d) { if (S.diaAb[d] && d > kH && d <= H.horizonte) pedirDia(d); }); }
      if (S.ab.rub && Object.keys(S.rubAb).some(function (r) { return S.rubAb[r]; }) && kP !== kH) pedirEntre(kP, kH, S.mira);
    }
    if (S.p === "pekin") asegurarPanel();
    if (S.p === "granos" && !S.granosError) pedirUna("granos", "granos");
    if (S.p === "estado" || S.p === "albor") { if (!S.estadoError) pedirUna("estado", "estado"); }
    if (S.p === "albor") { if (S.ab.ctrl && !S.controlError) pedirUna("control", "control"); if (S.ab.cambios) pedirDonde(kP, kH, H.fecha_fija); }
    if (S.p === "crudo") {
      var carga = crudoCarga();
      pedirCrudo(carga);
      var rc = cacheCrudo[carga], cr = rc && rc.data ? rc.data : null;
      if (cr && S.crudoVer && cr.archivos.some(function (a) { return a.id === S.crudoVer && a.existe; })) pedirCrudoFilas(cr.carga, S.crudoVer, S.crudoQ, S.crudoPag);
      if (cr && S.ab.ccols && !S.crudoVer) pedirCrudoFilas(cr.carga, "A", "", 1);
    }
  }

  // --- eventos delegados ----------------------------------------------------------------
  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-p],[data-sec],[data-abrir],[data-lat],[data-mas],[data-help],[data-set-mira],[data-dxd],[data-dia-ab],[data-rub-ab],[data-rub-todos],[data-mark],[data-quitar],[data-add],[data-agregar],[data-con10],[data-ver],[data-crudo],[data-rubro],[data-mot],[data-ir-par],[data-volver],[data-ir],[data-grano],[data-rxm],[data-capa],[data-crudo-ver],[data-crudo-pag],[data-crudo-q-limpiar],[data-reintentar],[data-notas-ab],[data-nota-guardar],[data-nota-dia],[data-mas-n],#olvidar");
    if (!el) return;
    if (el.id === "olvidar") { ev.preventDefault(); borrarLS(LS); location.replace(location.pathname); return; }
    if (el.hasAttribute("data-help")) { S.help = el.getAttribute("data-help") === "1"; render(); return; }
    if (el.hasAttribute("data-lat")) { S.latAb = !S.latAb; guardarLS("cf_lat", S.latAb ? "1" : "0"); render(); return; }
    if (el.hasAttribute("data-mas") && !el.hasAttribute("data-d")) { S.masAb = !S.masAb; render(); return; }
    if (el.hasAttribute("data-ir-par")) { if (!S.hoy) return; irAPar(el.getAttribute("data-ant"), el.getAttribute("data-dia"), true); S.masAb = false; tick(); return; }
    if (el.hasAttribute("data-p")) {
      var p = el.getAttribute("data-p");
      if (el.hasAttribute("data-sub")) { S.subOcultas = !S.subOcultas; render(); return; }
      if (el.hasAttribute("data-mira") && esFecha(el.getAttribute("data-mira"))) { S.mira = el.getAttribute("data-mira"); S.pErr = ""; }
      S.p = p; S.help = false; S.masAb = false; S.subOcultas = false; window.scrollTo(0, 0); tick(); return;
    }
    if (el.hasAttribute("data-sec")) { var sid = el.getAttribute("data-sec"); S.ab[sid] = !S.ab[sid]; tick(); return; }
    if (el.hasAttribute("data-abrir")) { var aid = el.getAttribute("data-abrir"); S.ab[aid] = true; tick(); irA("sec-" + aid); return; }
    if (el.hasAttribute("data-set-mira")) { S.mira = el.getAttribute("data-set-mira"); S.pErr = ""; tick(); return; }
    if (el.hasAttribute("data-dxd")) { S.dxd = el.getAttribute("data-dxd"); tick(); return; }
    if (el.hasAttribute("data-dia-ab")) { var dd = el.getAttribute("data-dia-ab"); S.diaAb[dd] = !S.diaAb[dd]; tick(); return; }
    if (el.hasAttribute("data-rub-ab")) { var rr = el.getAttribute("data-rub-ab"); S.rubAb[rr] = !S.rubAb[rr]; tick(); return; }
    if (el.hasAttribute("data-rub-todos")) { var todos = el.getAttribute("data-rub-todos") === "1"; S.rubAb = {}; if (todos) { var rD = cacheD[claveD(bajadaDe(S.parado), S.hoy.hoy, S.mira)]; if (rD && rD.data) rD.data.rubros.forEach(function (x) { S.rubAb[x.rubro] = true; }); } tick(); return; }
    if (el.hasAttribute("data-mark")) {
      var f = el.getAttribute("data-mark"), m = S.marks.slice();
      if (m.indexOf(f) >= 0) { if (m.length > 1) m = m.filter(function (y) { return y !== f; }); }
      else if (m.length < 2) m = m.concat([f]);
      else { var ord = m.slice().sort(); m = [ord[1], f]; }
      limpiarPanel(); S.marks = m.sort(); tick(); return;
    }
    if (el.hasAttribute("data-quitar")) { var qq = el.getAttribute("data-quitar"); S.cols = S.cols.filter(function (y) { return y !== qq; }); tick(); return; }
    if (el.hasAttribute("data-add")) { S.add = !S.add; render(); return; }
    if (el.hasAttribute("data-agregar")) { var ag = el.getAttribute("data-agregar"); if (ag && S.cols.indexOf(ag) < 0) { S.cols.push(ag); S.cols.sort(); } S.add = false; tick(); return; }
    if (el.hasAttribute("data-con10")) { S.con10 = el.getAttribute("data-con10") === "1"; tick(); return; }
    if (el.hasAttribute("data-ver")) { var vv = el.getAttribute("data-ver"); S.ver = S.ver === vv && !el.classList.contains("kcard") && !el.closest("#cf-panel") ? null : vv; S.ab.panel = true; tick(); if (S.ver) irA("cf-panel"); return; }
    if (el.hasAttribute("data-crudo")) { S.crudoCarga = el.getAttribute("data-crudo"); S.crudoVer = null; S.crudoQ = ""; S.crudoPag = 1; S.p = "crudo"; window.scrollTo(0, 0); tick(); return; }
    if (el.hasAttribute("data-rubro")) { var rb = el.getAttribute("data-rubro"); S.rubSel = S.rubSel === rb ? null : rb; tick(); return; }
    if (el.hasAttribute("data-mot")) { var mo = el.getAttribute("data-mot"); S.motFil = S.motFil === mo ? null : mo; S.compsTodos = !!S.motFil; delete S.abN["comp|"]; delete S.abN["comp|" + mo]; tick(); if (S.motFil) irA("cf-lista"); return; }
    if (el.hasAttribute("data-volver")) { limpiarPanel(); S.marks = [S.parado, cargaHoy()].sort(); tick(); return; }
    if (el.hasAttribute("data-ir")) { ev.preventDefault(); irA(el.getAttribute("data-ir")); return; }
    if (el.hasAttribute("data-mas")) { var mk = el.getAttribute("data-mas"), mn = +el.getAttribute("data-n"), md = +el.getAttribute("data-d"); var cur = Math.max(mn, S.abN[mk] || mn); S.abN[mk] = Math.max(mn, cur + md * PASO); if (mk.indexOf("comp|") === 0 && md < 0) S.compsTodos = false; tick(); return; }
    if (el.hasAttribute("data-grano")) { S.grano = el.getAttribute("data-grano"); tick(); return; }
    if (el.hasAttribute("data-rxm")) { S.rxm = el.getAttribute("data-rxm"); tick(); return; }
    if (el.hasAttribute("data-capa")) { var cp = el.getAttribute("data-capa"); S.capaAb[cp] = !S.capaAb[cp]; render(); return; }
    if (el.hasAttribute("data-crudo-ver")) { var cv = el.getAttribute("data-crudo-ver"); S.crudoVer = S.crudoVer === cv ? null : cv; S.crudoPag = 1; tick(); if (S.crudoVer) irA("cf-crudo-ver"); return; }
    if (el.hasAttribute("data-crudo-pag")) { S.crudoPag = Math.max(1, +el.getAttribute("data-crudo-pag") || 1); tick(); irA("cf-crudo-ver"); return; }
    if (el.hasAttribute("data-crudo-q-limpiar")) { S.crudoQ = ""; S.crudoPag = 1; tick(); return; }
    if (el.hasAttribute("data-reintentar")) {
      var que = el.getAttribute("data-reintentar");
      if (que === "hoy") { S.hoy = null; S.pekin = null; render(); pedirHoy(); return; }
      S[que] = null; S[que + "Error"] = null; S[que + "Cargando"] = false; tick(); return;
    }
    if (el.hasAttribute("data-notas-ab")) { S.notasAb = !S.notasAb; render(); return; }
    if (el.hasAttribute("data-nota-dia")) { S.notaDia = el.getAttribute("data-nota-dia") || null; tick(); return; }
    if (el.hasAttribute("data-nota-guardar")) {
      var inp = document.getElementById(el.getAttribute("data-nota-guardar"));
      var dia = el.getAttribute("data-nota-para") || S.notaDia || null;
      if (inp && agregarNota(inp.value, dia)) { inp.value = ""; render(); ["cf-notas-lista", "cf-notas-lista-xl"].forEach(function (id) { var l = document.getElementById(id); if (l) l.scrollTop = l.scrollHeight; }); }
      return;
    }
  });
  app.addEventListener("toggle", function (ev) { var d = ev.target; if (d && d.tagName === "DETAILS" && d.hasAttribute("data-o")) S.abiertos[d.getAttribute("data-o")] = d.open; }, true);
  app.addEventListener("submit", function (ev) {
    var f = ev.target;
    if (f && f.hasAttribute && f.hasAttribute("data-crudo-q")) { ev.preventDefault(); var i = document.getElementById("cf-crudo-q"); S.crudoQ = i ? i.value.trim() : ""; S.crudoPag = 1; tick(); }
  });
  app.addEventListener("change", function (ev) {
    var el = ev.target;
    if (!el.hasAttribute || !el.hasAttribute("data-set")) return;
    var que = el.getAttribute("data-set"), v = el.value;
    if (que === "parado") {
      if (!esFecha(v)) { S.pErr = "Elegí una fecha."; render(); return; }
      if (v < primeraCarga() || v > cargaHoy()) { S.pErr = "«Parado el» va del " + larga(primeraCarga()) + " (primera carga con saldo de bancos) a hoy."; render(); return; }
      var cp = cargaPara(v); S.parado = cp.carga; S.paradoPedido = v; S.pErr = ""; S.rubAb = {}; tick(); return;
    }
    if (que === "mira") {
      if (!esFecha(v)) { S.pErr = "Elegí una fecha."; render(); return; }
      if (v < S.pekin.bancos_desde || v > S.hoy.horizonte) { S.pErr = "«Mirando al» va del " + larga(S.pekin.bancos_desde) + " al " + larga(S.hoy.horizonte) + " (hasta donde proyecta Albor)."; render(); return; }
      S.mira = v; S.pErr = ""; S.diaAb = {}; tick(); return;
    }
    if (que === "addDia") { if (esFecha(v)) { S.addDia = v; render(); } return; }
    if (que === "crudoCarga") { if (esFecha(v) && v >= PRIMERA_CARGA && v <= cargaHoy()) { S.crudoCarga = v; S.crudoVer = null; S.crudoQ = ""; S.crudoPag = 1; tick(); } return; }
    if (que === "notaDia") { S.notaDia = esFecha(v) ? v : null; tick(); return; }
  });

  // --- arranque ----------------------------------------------------------------------
  if (!k) {
    app.innerHTML = '<div class="wrap"><div class="aviso" role="alert" id="cf-error"><b>Falta la clave en el link.</b> El link completo lleva la clave (<code>?k=…</code> o <code>#k=…</code>): pedíselo a quien te lo pasó y abrilo entero. Después de la primera vez, este aparato la recuerda.</div></div>';
    return;
  }
  render();
  pedirHoy();
  pedirSello();
})();
