<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Flow Lacau</title>

<!--
  tabla.html v8 (24/09/2026) — LOS CUATRO ESCALONES. Pablo pidió textual dos bloques y nada
  más, así que las cuatro pestañas de la v7 se sacan. La pantalla es una sola:

    BLOQUE 1 · COMPARADOR (la imagen principal)
      Selector foto A / foto B / fecha objetivo. Tabla cf_comparador(a, b, objetivo): rubro,
      capa (COMPROMETIDO = documento con un tercero · PRESUPUESTO = cuenta contable), A, B, Δ,
      ordenada por materialidad. La fila de bancos lleva su nota a la vista, no en un tooltip.
      Pie obligatorio: cf_comparador_residuo(a, b), las tres líneas literales de la base. El
      residuo a la vista es lo que prueba que el número no infla.

    DRILL-DOWN (click en un rubro)
      Los comprobantes que cambiaron en el tramo (a, b]: tipo, comprobante, descripción,
      antes, después, Δ. Si el rubro es 04 - OTROS INGRESOS, además cf_stock_cambios(a, b):
      "tonelaje −1.300 TN", "precio +15 USD/TN", "TC +25".

    BLOQUE 2 · EVOLUCIÓN (cuelga del comparador)
      analisis.matriz_pablo filtrada a la fecha objetivo elegida: filas = fotos, se lee hacia
      abajo. Arriba, de analisis.valle: el mes del valle y los MM del valle de la foto B. Ese
      es el número que obliga a decidir algo, no el total al horizonte.

    STOCK (bloque chico)
      analisis.stock_granos de la foto B: grano, TN, USD/TN, TC, MM. Una fila con
      parseo_ok = false se pinta en rojo y no entra en el total.

  DÓNDE VA: repo peiotaio/tablero-lacau (GitHub Pages). Abre en /tabla.html#k=<clave>.
  LA CLAVE nunca se escribe acá: se lee del hash, que el navegador no manda al servidor.
  TODO viene calculado del servidor (edge function `tabla` v8, ?vista=comparador y
  ?vista=detalle) y del registro inmutable: acá no se suma nada, solo se pinta.
  Deep link: #k=<clave>&a=YYYY-MM-DD&b=YYYY-MM-DD&obj=YYYY-MM&rubro=<rubro>.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --verde:#14452f; --verde-medio:#1b5e3f; --verde-papel:#e8ede7;
    --crema:#fcfbf8; --banda:#f3f1ea; --linea:#e4e1d8;
    --tinta:#1d242e; --tinta-media:#3c4451; --gris:#7c838c;
    --ocre:#b57b23; --ocre-claro:#fcf6e9; --ocre-borde:#e8d9b4;
    --rojo:#b4442e; --rojo-claro:#faeeea;
    --azul:#2b4f7a; --azul-claro:#e6eef7;
  }
  *{box-sizing:border-box}
  html{background:var(--crema)}
  body{margin:0;background:var(--crema);color:var(--tinta);
       font-family:Lato,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
  .caja{max-width:960px;margin:0 auto;padding:28px 16px 64px}

  .ante{font-size:9px;font-weight:700;color:var(--verde);text-transform:uppercase;
        letter-spacing:.22em;margin:0 0 8px}
  h1{font-size:30px;font-weight:900;margin:0 0 6px;line-height:1.15}
  .bajada{font-size:14px;font-weight:300;color:var(--tinta-media);margin:0 0 4px}
  .filete{height:1px;background:var(--verde);margin:14px 0 20px}

  h2{font-size:9px;font-weight:700;color:var(--verde-medio);text-transform:uppercase;
     letter-spacing:.22em;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--linea)}
  h2.primera{margin-top:6px;padding-top:0;border-top:none}
  .que{font-size:13px;font-weight:300;color:var(--tinta-media);margin:0 0 14px;line-height:1.5}

  .estado{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;
          font-size:12px;color:var(--gris);margin:0 0 16px}
  .punto{display:inline-block;width:8px;height:8px;border-radius:50%;
         background:var(--verde-medio);margin-right:6px;vertical-align:1px}
  .punto.mal{background:var(--rojo)}
  .estado b{color:var(--tinta);font-weight:700}

  .controles{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;
             background:var(--verde-papel);padding:14px 16px;margin:0 0 10px}
  .campo{display:flex;flex-direction:column;gap:4px}
  .campo label{font-size:8.4px;font-weight:700;text-transform:uppercase;
               letter-spacing:.22em;color:var(--verde-medio)}
  .campo select{font-family:inherit;font-size:13px;font-weight:700;color:var(--tinta);
    border:1px solid var(--linea);background:#fff;padding:6px 8px;border-radius:2px}
  .atajos{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
  .atajos button,.toggle{font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;
    background:#fff;color:var(--verde-medio);border:1px solid var(--ocre-borde);
    padding:5px 10px;border-radius:2px}
  .atajos button:hover,.toggle:hover{background:var(--ocre-claro)}
  .atajos button.activo{background:var(--verde);color:#fff;border-color:var(--verde)}
  .toggle{margin:0 0 10px}

  .cab{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:flex-end;margin:0 0 16px}
  .cifra{display:flex;flex-direction:column;gap:3px}
  .cifra span{font-size:8.4px;font-weight:700;text-transform:uppercase;letter-spacing:.22em;
              color:var(--verde-medio)}
  .cifra b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  .cifra b.neg{color:var(--rojo)}
  .cifra b.chica{font-size:18px}
  .cifra i{font-style:normal;font-size:11px;color:var(--gris)}

  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
  thead th{background:var(--verde);color:#fff;font-weight:700;font-size:9.4px;
    text-transform:uppercase;letter-spacing:.14em;padding:9px 10px;text-align:right;white-space:nowrap}
  thead th:first-child{text-align:left}
  tbody td{padding:8px 10px;text-align:right;white-space:nowrap;
    font-variant-numeric:tabular-nums;font-weight:700;vertical-align:top}
  tbody td:first-child{text-align:left;white-space:normal}
  tbody tr:nth-child(odd){background:var(--banda)}
  tfoot td{padding:9px 10px;text-align:right;font-weight:900;color:var(--verde);
    border-top:1px solid var(--verde);background:var(--verde-papel);
    font-variant-numeric:tabular-nums}
  tfoot td:first-child{text-align:left}
  .neg{color:var(--rojo)}
  .izq{text-align:left !important;white-space:normal !important;font-weight:400 !important}
  .chico{font-size:11px;font-weight:400;color:var(--gris)}

  .comp tbody tr{cursor:pointer}
  .comp tbody tr:hover td{background:var(--ocre-claro)}
  .comp tbody tr.sel td{background:var(--verde-papel);color:var(--verde)}
  .comp .nom{font-weight:700}
  .nota-fila{display:block;font-size:11px;font-weight:400;color:var(--ocre);margin-top:3px}
  .capa{display:inline-block;font-size:9px;font-weight:900;letter-spacing:.12em;padding:2px 7px;
        border-radius:2px;text-transform:uppercase;margin-left:8px;vertical-align:1px}
  .capa.com{background:var(--verde-papel);color:var(--verde)}
  .capa.pre{background:var(--azul-claro);color:var(--azul)}
  .capa.otra{background:#eceae4;color:var(--gris)}
  .leyenda{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:11.5px;color:var(--tinta-media);
           margin:10px 0 0;line-height:1.5}
  .leyenda .capa{margin:0 6px 0 0}

  .lectura{margin:16px 0 0;background:var(--ocre-claro);border:1px solid var(--ocre-borde);
    border-radius:3px;padding:15px 17px}
  .lectura h3{margin:0 0 10px;font-size:9px;font-weight:700;color:var(--ocre);
              text-transform:uppercase;letter-spacing:.22em}
  .residuo{display:grid;grid-template-columns:minmax(150px,1.2fr) 100px 2fr;gap:6px 14px;
           font-size:12.5px;color:var(--tinta-media);align-items:baseline}
  .residuo b{color:var(--tinta);font-variant-numeric:tabular-nums;text-align:right}
  .residuo .con{font-weight:700;color:var(--tinta)}
  .residuo .exp{font-weight:300}
  .residuo .pri .con,.residuo .pri b{font-size:14px}
  @media (max-width:560px){
    .residuo{grid-template-columns:1fr 90px}
    .residuo .exp{grid-column:1 / -1;margin:-2px 0 6px;font-size:11.5px}
  }

  .aviso{background:var(--rojo-claro);border-left:3px solid var(--rojo);padding:11px 14px;
    font-size:12.5px;line-height:1.5;margin:0 0 16px;color:var(--tinta-media)}
  .ok{background:var(--verde-papel);border-left:3px solid var(--verde-medio);padding:10px 14px;
    font-size:12px;margin:0 0 16px;color:var(--tinta-media)}
  .nota-dia{font-size:12.5px;color:var(--tinta-media);margin:0 0 12px;line-height:1.5}
  .nota-dia b{color:var(--tinta)}

  .stock-cambio{margin:0 0 16px;background:var(--azul-claro);border-radius:3px;padding:13px 16px}
  .stock-cambio h3{margin:0 0 8px;font-size:9px;font-weight:700;color:var(--azul);
                   text-transform:uppercase;letter-spacing:.22em}
  .stock-cambio p{margin:0 0 6px;font-size:13px;color:var(--tinta-media);line-height:1.55}
  .stock-cambio p:last-child{margin:0}
  .stock-cambio b{color:var(--tinta);font-variant-numeric:tabular-nums}
  .efecto{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;
          background:#fff;color:var(--azul);margin:2px 4px 0 0;font-variant-numeric:tabular-nums}
  .efecto.cero{color:var(--gris);font-weight:400}

  .evo tbody tr.a td,.evo tbody tr.b td{background:var(--verde-papel);color:var(--verde)}
  .evo tbody tr.b td:first-child::after{content:" B";font-size:9px;letter-spacing:.14em;color:var(--verde-medio)}
  .evo tbody tr.a td:first-child::after{content:" A";font-size:9px;letter-spacing:.14em;color:var(--verde-medio)}
  .evo .barra{display:inline-block;height:7px;background:var(--linea);vertical-align:1px;
              position:relative;width:110px;margin-left:10px}
  .evo .barra i{position:absolute;top:0;height:100%;background:var(--verde-medio)}
  .evo .barra i.neg{background:var(--rojo)}

  .stk tbody tr.mal td{color:var(--rojo);background:var(--rojo-claro)}
  .marca{display:inline-block;margin-left:7px;font-size:8.4px;font-weight:700;
    text-transform:uppercase;letter-spacing:.14em;color:var(--rojo)}

  .pie{margin-top:34px;padding-top:12px;border-top:1px solid var(--linea);
    font-size:11px;font-weight:300;color:var(--gris);line-height:1.6}
</style>
</head>
<body>

<div class="caja">
  <p class="ante">Lacau y Cía S.A.</p>
  <h1>Cash Flow</h1>
  <p class="bajada">Qué se movió entre dos fotos y a dónde va el acumulado. Leído del registro
    inmutable, con el criterio de administración.</p>
  <div class="filete"></div>
  <div id="cuerpo"><p style="color:var(--gris);font-size:13px">Cargando…</p></div>
</div>

<script>
(function () {
  var API = "https://htxtrmfmrzvgukqzjjnh.supabase.co/functions/v1/tabla";
  var hash = new URLSearchParams(location.hash.slice(1));
  var k = hash.get("k");
  var cuerpo = document.getElementById("cuerpo");
  var esFecha = function (s) { return !!s && /^\d{4}-\d{2}-\d{2}$/.test(s); };
  var esMes = function (s) { return !!s && /^\d{4}-\d{2}$/.test(s); };

  var estado = {
    a: esFecha(hash.get("a")) ? hash.get("a") : null,
    b: esFecha(hash.get("b")) ? hash.get("b") : null,
    obj: esMes(hash.get("obj")) ? hash.get("obj") : null,
    rubro: hash.get("rubro") || null,
    d: null,          // la última respuesta del comparador
    det: null,        // el drill-down del rubro elegido
    detTodos: false,
    evoTodas: false
  };

  if (!k) {
    cuerpo.innerHTML = '<div class="aviso">Falta la clave en el link. ' +
      'El link completo termina en <code>#k=…</code>.</div>';
    return;
  }

  // --- formato ------------------------------------------------------------------
  var n2 = function (v) {
    if (v === null || v === undefined) return "·";
    return v.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };
  var n0 = function (v) {
    if (v === null || v === undefined) return "·";
    return v.toLocaleString("es-AR", { maximumFractionDigits: 2 });
  };
  var sig = function (v, dec) {
    if (v === null || v === undefined) return "·";
    var f = dec === 0 ? n0 : n2;
    return (v > 0 ? "+" : "") + f(v);
  };
  var tdn = function (v) {
    return '<td class="' + (v !== null && v !== undefined && v < 0 ? "neg" : "") + '">' + n2(v) + "</td>";
  };
  var tds = function (v) {
    return '<td class="' + (v !== null && v !== undefined && v < 0 ? "neg" : "") + '">' + sig(v) + "</td>";
  };
  var esc = function (s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  };
  var dmy = function (s) { return s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "—"; };
  var dm = function (s) { return s ? s.slice(8, 10) + "/" + s.slice(5, 7) : "—"; };
  var MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var MESL = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
              "septiembre","octubre","noviembre","diciembre"];
  var rot = function (ym) { return ym ? MES[Number(ym.slice(5, 7)) - 1] + "-" + ym.slice(2, 4) : "—"; };
  var mesLargo = function (ym) { return ym ? MESL[Number(ym.slice(5, 7)) - 1] + " " + ym.slice(0, 4) : "—"; };
  var capaClase = function (c) { return c === "COMPROMETIDO" ? "com" : c === "PRESUPUESTO" ? "pre" : "otra"; };
  var chipCapa = function (c) { return '<span class="capa ' + capaClase(c) + '">' + esc(c) + "</span>"; };

  // El hash lleva el estado (sin recargar): se puede copiar el link tal cual.
  function guardarHash() {
    var p = new URLSearchParams({ k: k });
    if (estado.a) p.set("a", estado.a);
    if (estado.b) p.set("b", estado.b);
    if (estado.obj) p.set("obj", estado.obj);
    if (estado.rubro) p.set("rubro", estado.rubro);
    history.replaceState(null, "", "#" + p.toString());
  }

  // --- pedir al servidor ----------------------------------------------------------
  function traer(p) {
    p.set("k", k);
    return fetch(API + "?" + p.toString()).then(function (r) {
      if (r.status === 401) throw new Error("La clave del link no es válida.");
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || ("Error " + r.status)); });
      return r.json();
    });
  }

  function pedir() {
    var p = new URLSearchParams({ vista: "comparador" });
    if (estado.a) p.set("a", estado.a);
    if (estado.b) p.set("b", estado.b);
    if (estado.obj) p.set("objetivo", estado.obj);
    traer(p)
      .then(function (d) {
        estado.d = d;
        estado.a = d.a.fecha; estado.b = d.b.fecha; estado.obj = d.objetivo;
        guardarHash();
        pintar();
        if (estado.rubro) pedirDetalle();
      })
      .catch(function (e) {
        cuerpo.innerHTML = '<div class="aviso">' + esc(e.message || "No se pudo cargar.") + "</div>";
      });
  }

  function pedirDetalle() {
    var d = estado.d, rubro = estado.rubro;
    if (!d || !rubro) return;
    if (estado.det && estado.det.a === d.a.fecha && estado.det.b === d.b.fecha &&
        estado.det.rubro === rubro && !estado.det.error) { pintarDetalleEn(); return; }
    estado.det = { a: d.a.fecha, b: d.b.fecha, rubro: rubro, cargando: true };
    pintarDetalleEn();
    traer(new URLSearchParams({ vista: "detalle", a: d.a.fecha, b: d.b.fecha, rubro: rubro }))
      .then(function (x) {
        estado.det = { a: d.a.fecha, b: d.b.fecha, rubro: rubro, filas: x.filas || [],
                       total_filas: x.total_filas || 0, fecha_anterior: x.fecha_anterior,
                       dias: x.dias_en_el_tramo, stock: x.stock_cambios || null };
      })
      .catch(function (e) {
        estado.det = { a: d.a.fecha, b: d.b.fecha, rubro: rubro,
                       error: e.message || "No se pudo cargar el detalle." };
      })
      .then(function () {
        if (estado.rubro === rubro && estado.d === d) pintarDetalleEn();
      });
  }

  // --- pintar ----------------------------------------------------------------------
  function pintar() {
    var d = estado.d;
    var h = "";

    // Estado
    var bHoy = d.b.fecha === d.hoy;
    h += '<div class="estado">' +
      '<span><i class="punto' + (bHoy ? "" : " mal") + '"></i>' +
      (bHoy ? "La foto B es la de <b>hoy</b> (" + esc(d.b.hora_ar) + " AR)"
            : "La foto B es del <b>" + dmy(d.b.fecha) + "</b>, no de hoy") + "</span>" +
      "<span>Horizonte de la foto B: <b>" + dmy(d.b.horizonte) + "</b>" +
      (d.a.horizonte && d.a.horizonte !== d.b.horizonte
        ? ' <span class="chico">(la A llegaba a ' + dmy(d.a.horizonte) + ")</span>" : "") + "</span>" +
      "<span>Todo en <b>millones de pesos</b></span>" +
      "</div>";

    // Controles
    var opciones = function (lista, sel, f) {
      return lista.map(function (x) {
        return '<option value="' + x + '"' + (x === sel ? " selected" : "") + ">" + f(x) + "</option>";
      }).join("");
    };
    var fotosA = d.fotos.filter(function (f) { return f < d.b.fecha; });
    h += '<div class="controles">' +
      '<div class="campo"><label>Foto A (antes)</label><select id="s-a">' + opciones(fotosA, d.a.fecha, dmy) + "</select></div>" +
      '<div class="campo"><label>Foto B (después)</label><select id="s-b">' + opciones(d.fotos, d.b.fecha, dmy) + "</select></div>" +
      '<div class="campo"><label>Fecha objetivo (acumulado a)</label><select id="s-obj">' +
        opciones(d.objetivos, d.objetivo, function (m) { return mesLargo(m) + (m === d.objetivos[d.objetivos.length - 1] ? " · horizonte" : ""); }) +
      "</select></div>" +
      "</div>";

    // Atajos: A relativo a B.
    var atajo = function (id, rotulo, fecha) {
      var ok = !!fecha && fecha < d.b.fecha;
      return '<button id="' + id + '"' + (ok ? "" : " disabled") + (fecha === d.a.fecha ? ' class="activo"' : "") +
             ' data-f="' + (fecha || "") + '">' + rotulo + "</button>";
    };
    var antesDe = function (dias) {
      var lim = new Date(d.b.fecha + "T12:00:00Z"); lim.setUTCDate(lim.getUTCDate() - dias);
      var iso = lim.toISOString().slice(0, 10);
      for (var i = 0; i < d.fotos.length; i++) if (d.fotos[i] <= iso) return d.fotos[i];
      return null;
    };
    h += '<div class="atajos">' +
      atajo("at-1", "A = la foto anterior", d.fecha_anterior_de_b) +
      atajo("at-7", "A = hace una semana", antesDe(7)) +
      atajo("at-30", "A = hace un mes", antesDe(30)) +
      (d.b.fecha !== d.fotos[0] ? '<button id="at-ult" data-f="' + d.fotos[0] + '">B = la última foto</button>' : "") +
      "</div>";

    // ===== BLOQUE 1 · COMPARADOR ==================================================
    h += '<h2 class="primera">Qué se movió · del ' + dmy(d.a.fecha) + " al " + dmy(d.b.fecha) + "</h2>";
    h += '<p class="que">Cada rubro leído con el criterio de administración desde la fecha de cada foto, ' +
         "acumulado a <b>" + mesLargo(d.objetivo) + "</b>. Ordenado por lo que más pesa. " +
         "Click en un rubro: de qué comprobantes viene.</p>";

    var dl = d.total.delta;
    h += '<div class="cab">' +
      '<div class="cifra"><span>A · ' + dm(d.a.fecha) + '</span><b class="chica' + (d.total.a < 0 ? " neg" : "") + '">' + n2(d.total.a) + "</b></div>" +
      '<div class="cifra"><span>B · ' + dm(d.b.fecha) + '</span><b class="chica' + (d.total.b < 0 ? " neg" : "") + '">' + n2(d.total.b) + "</b></div>" +
      '<div class="cifra"><span>Δ acumulado a ' + rot(d.objetivo) + '</span><b class="' + (dl < 0 ? "neg" : "") + '">' + sig(dl) + "</b>" +
      "<i>" + d.filas.length + " rubros con cambio</i></div>" +
      "</div>";

    if (!d.filas.length) {
      h += '<div class="ok">Ningún rubro cambió entre la foto del ' + dm(d.a.fecha) + " y la del " + dm(d.b.fecha) +
           " acumulando a " + mesLargo(d.objetivo) + ".</div>";
    } else {
      h += '<div class="scroll"><table class="comp"><thead><tr>' +
        "<th>Rubro</th><th>A · " + dm(d.a.fecha) + "</th><th>B · " + dm(d.b.fecha) + "</th><th>Δ</th>" +
        "</tr></thead><tbody>";
      d.filas.forEach(function (f) {
        h += '<tr data-r="' + esc(f.rubro) + '"' + (estado.rubro === f.rubro ? ' class="sel"' : "") + ">" +
          '<td><span class="nom">' + esc(f.rubro) + "</span>" + chipCapa(f.capa) +
          (f.nota ? '<span class="nota-fila">' + esc(f.nota) + "</span>" : "") + "</td>" +
          tdn(f.a) + tdn(f.b) + tds(f.delta) + "</tr>";
      });
      h += "</tbody><tfoot><tr><td>Total de los rubros con cambio</td><td></td><td></td>" +
           '<td class="' + (d.total.delta_filas < 0 ? "neg" : "") + '">' + sig(d.total.delta_filas) + "</td></tr></tfoot></table></div>";
      h += '<div class="leyenda">' +
        "<span>" + chipCapa("COMPROMETIDO") + esc(d.capas.COMPROMETIDO || "documento con un tercero") + "</span>" +
        "<span>" + chipCapa("PRESUPUESTO") + esc(d.capas.PRESUPUESTO || "cuenta contable") + "</span>" +
        "</div>";
    }

    // Drill-down (se pinta aparte, en #det)
    h += '<div id="det"></div>';

    // Pie obligatorio: el residuo
    h += '<div class="lectura"><h3>Residuo · ¿el número infla?</h3>';
    if (d.residuo_valido && d.residuo.length) {
      h += '<div class="residuo">';
      d.residuo.forEach(function (r, i) {
        var cls = i === 0 ? " pri" : "";
        h += '<span class="con' + cls + '">' + esc(r.concepto) + "</span>" +
             '<b class="' + (r.mm < 0 ? "neg" : "") + cls + '">' + sig(r.mm) + "</b>" +
             '<span class="exp">' + esc(r.explica) + "</span>";
      });
      h += "</div>";
    } else {
      h += '<p class="nota-dia" style="margin:0">El residuo por comprobantes se calcula entre dos fotos ' +
        "<b>consecutivas</b> del registro. La A elegida (" + dm(d.a.fecha) + ") no es la anterior a la B (" +
        dm(d.b.fecha) + "): la anterior es la del <b>" + dm(d.fecha_anterior_de_b) + "</b>. " +
        '<button class="toggle" id="r-ant" style="margin:6px 0 0">Usar la foto anterior como A</button></p>';
    }
    h += "</div>";

    // ===== BLOQUE 2 · EVOLUCIÓN ===================================================
    h += "<h2>A dónde va · acumulado a " + mesLargo(d.objetivo) + ", foto por foto</h2>";
    h += '<p class="que">Cada fila es una foto del bot y su acumulado a la misma fecha objetivo. ' +
         "Se lee hacia abajo: el número de hoy contra el de cada día anterior.</p>";
    if (d.valle) {
      h += '<div class="cab">' +
        '<div class="cifra"><span>El valle de la foto B · ' + mesLargo(d.valle.mes) + '</span><b class="' + (d.valle.mm < 0 ? "neg" : "") + '">' + n2(d.valle.mm) + "</b>" +
        "<i>el mes en que el acumulado toca fondo: ese número obliga a decidir</i></div>" +
        '<div class="cifra"><span>Total al horizonte · ' + dm(d.b.horizonte) + '</span><b class="chica' + (d.valle.total_final < 0 ? " neg" : "") + '">' + n2(d.valle.total_final) + "</b></div>" +
        "</div>";
    }
    var evo = d.evolucion;
    var EVO_VISTA = 15;
    var lista = estado.evoTodas ? evo : evo.slice(0, EVO_VISTA);
    var maxAbs = evo.reduce(function (m, r) { return Math.max(m, Math.abs(r.acumulado)); }, 0) || 1;
    if (evo.length > EVO_VISTA) {
      h += '<button class="toggle" id="e-todas">' +
        (estado.evoTodas ? "solo las últimas " + EVO_VISTA : "ver todas las fotos (" + evo.length + ")") + "</button>";
    }
    h += '<div class="scroll"><table class="evo"><thead><tr>' +
      "<th>Foto</th><th>Acumulado a " + rot(d.objetivo) + "</th><th>vs foto anterior</th></tr></thead><tbody>";
    lista.forEach(function (r) {
      var cls = r.foto === d.b.fecha ? " class=\"b\"" : r.foto === d.a.fecha ? " class=\"a\"" : "";
      var w = Math.round(Math.abs(r.acumulado) / maxAbs * 100);
      h += "<tr" + cls + "><td>" + dmy(r.foto) + "</td>" +
        '<td><span class="' + (r.acumulado < 0 ? "neg" : "") + '">' + n2(r.acumulado) + "</span>" +
        '<span class="barra"><i class="' + (r.acumulado < 0 ? "neg" : "") + '" style="width:' + w + '%;' +
        (r.acumulado < 0 ? "right:0" : "left:0") + '"></i></span></td>' +
        tds(r.vs_anterior) + "</tr>";
    });
    h += "</tbody></table></div>";

    // ===== STOCK (chico) =========================================================
    h += "<h2>Stock de granos · foto del " + dmy(d.b.fecha) + "</h2>";
    if (!d.stock.filas.length) {
      h += '<div class="ok">La foto del ' + dm(d.b.fecha) + " no trae filas de stock (04 - OTROS INGRESOS).</div>";
    } else {
      h += '<p class="que">Lo que finanzas carga como stock a vender, tal cual está escrito en Albor: ' +
           "toneladas × precio × tipo de cambio. Es presupuesto, no un contrato." +
           (d.stock.n_mal ? " <b>" + d.stock.n_mal + " fila(s) no cierran</b> (el importe no coincide con TN × precio × TC): van en rojo y no entran en el total." : "") +
           "</p>";
      h += '<div class="scroll"><table class="stk"><thead><tr>' +
        "<th>Grano</th><th>Fecha</th><th>TN</th><th>USD/TN</th><th>TC</th><th>MM</th></tr></thead><tbody>";
      d.stock.filas.forEach(function (s) {
        h += "<tr" + (s.parseo_ok ? "" : ' class="mal"') + '><td><span class="nom" title="' + esc(s.descripcion) + " · comprobante " + esc(s.comprobante) + '">' +
          esc(s.grano) + "</span>" + (s.parseo_ok ? "" : '<span class="marca">no cierra · no se usa</span>') +
          '<span class="chico" style="display:block">' + esc(s.descripcion) + "</span></td>" +
          "<td>" + dmy(s.fecha_mov) + "</td><td>" + n0(s.tn) + "</td><td>" + n0(s.usd_tn) + "</td>" +
          "<td>" + n2(s.tc) + "</td>" + tdn(s.mm) + "</tr>";
      });
      h += "</tbody><tfoot><tr><td>Total (solo filas que cierran)</td><td colspan='4'></td>" + tdn(d.stock.total_mm) + "</tr></tfoot></table></div>";
    }

    // Pie
    h += '<div class="pie">Fuente: Albor → registro inmutable de fotos (una por día calendario, ' +
      "leída desde su propia fecha con el criterio de administración, sin rubros 12 / 16 / 17). " +
      "Una foto vieja no cambia nunca. Todo en millones de pesos con dos decimales, tal cual la base: " +
      "acá no se suma nada, solo se pinta.<br>" +
      "COMPROMETIDO: hay un documento con un tercero atrás. PRESUPUESTO: lo carga finanzas por " +
      "fórmula (rubros 04 y 09). Bancos: saldo conciliado del día, cambia todos los días y no tiene comprobante.</div>";

    cuerpo.innerHTML = h;
    atar();
    if (estado.rubro) pintarDetalleEn();
  }

  // --- drill-down ------------------------------------------------------------------
  var DET_VISTA = 30;
  function pintarDetalle() {
    var d = estado.d, x = estado.det, rubro = estado.rubro;
    if (!rubro) return "";
    var h = "<h2>De qué comprobantes viene · " + esc(rubro) + "</h2>";
    if (!x || x.cargando) return h + '<p class="nota-dia" style="color:var(--gris)">Cargando comprobantes…</p>';
    if (x.error) return h + '<div class="aviso">' + esc(x.error) + "</div>";

    // Stock: qué cambió (solo 04)
    if (x.stock && x.stock.length) {
      h += '<div class="stock-cambio"><h3>Stock · qué cambió de verdad</h3>';
      x.stock.forEach(function (s) {
        var dTn = (s.tn_despues || 0) - (s.tn_antes || 0);
        var dPr = (s.precio_despues || 0) - (s.precio_antes || 0);
        var dTc = (s.tc_despues || 0) - (s.tc_antes || 0);
        var ef = function (rot, delta, unidad, mm) {
          var cero = Math.abs(delta) < 0.005;
          return '<span class="efecto' + (cero ? " cero" : "") + '">' + rot + " " + sig(delta, 0) + (unidad ? " " + unidad : "") +
                 (cero ? "" : " → " + sig(mm) + " MM") + "</span>";
        };
        h += "<p><b>" + esc(s.grano) + "</b> (" + dmy(s.fecha_mov) + "): " +
          "de <b>" + n0(s.tn_antes) + "</b> a <b>" + n0(s.tn_despues) + " TN</b>, " +
          "de <b>" + n2(s.mm_antes) + "</b> a <b>" + n2(s.mm_despues) + " MM</b> " +
          '(<b class="' + (s.delta_mm < 0 ? "neg" : "") + '">' + sig(s.delta_mm) + " MM</b>).<br>" +
          ef("tonelaje", dTn, "TN", s.efecto_tn_mm) + ef("precio", dPr, "USD/TN", s.efecto_precio_mm) + ef("TC", dTc, "", s.efecto_tc_mm) +
          "</p>";
      });
      h += "</div>";
    }

    var filas = x.filas;
    if (!filas.length) {
      return h + '<div class="ok">Ningún comprobante de ' + esc(rubro) + " cambió entre la foto del " +
             dm(x.fecha_anterior) + " y la del " + dm(d.b.fecha) + ".</div>";
    }
    var lista = estado.detTodos ? filas : filas.slice(0, DET_VISTA);
    h += '<p class="nota-dia">Comprobantes que aparecieron, desaparecieron o cambiaron de importe entre la foto del <b>' +
      dm(x.fecha_anterior) + "</b> y la del <b>" + dm(d.b.fecha) + "</b>" +
      (x.dias > 1 ? " (" + x.dias + " fotos en el tramo, neteadas por comprobante)" : "") + ": <b>" + x.total_filas + "</b>" +
      (x.total_filas > filas.length ? " (se muestran los " + filas.length + " más grandes)" : "") + ".</p>";
    if (filas.length > DET_VISTA) {
      h += '<button class="toggle" id="d-todos">' +
        (estado.detTodos ? "solo los " + DET_VISTA + " más grandes" : "ver todos (" + filas.length + ")") + "</button>";
    }
    h += '<div class="scroll"><table><thead><tr>' +
      "<th>Tipo</th><th>Comprobante</th><th>Descripción</th><th>Fecha mov.</th><th>Antes</th><th>Después</th><th>Δ</th>" +
      "</tr></thead><tbody>";
    lista.forEach(function (f) {
      h += "<tr><td>" + esc(f.tipo) + "</td><td>" + esc(f.comprobante) + "</td>" +
        '<td class="izq">' + esc(f.descripcion) + '<span class="chico" style="display:block">' + esc(f.referente) + "</span></td>" +
        "<td>" + dmy(f.fecha_mov) + "</td>" + tdn(f.antes_mm) + tdn(f.despues_mm) + tds(f.delta_mm) + "</tr>";
    });
    h += "</tbody></table></div>";
    return h;
  }
  function pintarDetalleEn() {
    var el = document.getElementById("det");
    if (!el) return;
    el.innerHTML = pintarDetalle();
    var bt = document.getElementById("d-todos");
    if (bt) bt.onclick = function () { estado.detTodos = !estado.detTodos; pintarDetalleEn(); };
    if (estado.rubro) {
      var fila = document.querySelector('.comp tr[data-r="' + estado.rubro.replace(/"/g, "&quot;") + '"]');
      Array.prototype.forEach.call(document.querySelectorAll(".comp tbody tr"), function (tr) { tr.classList.remove("sel"); });
      if (fila) fila.classList.add("sel");
    }
  }

  // --- eventos ---------------------------------------------------------------------
  function atar() {
    var d = estado.d;
    var cambiar = function (patch) {
      Object.keys(patch).forEach(function (k2) { estado[k2] = patch[k2]; });
      estado.det = null; estado.detTodos = false;
      pedir();
    };
    document.getElementById("s-a").onchange = function () { cambiar({ a: this.value }); };
    document.getElementById("s-b").onchange = function () {
      var b = this.value;
      // Si A queda por encima de la nueva B, se corre a la anterior de B.
      var a = estado.a && estado.a < b ? estado.a : null;
      cambiar({ b: b, a: a });
    };
    document.getElementById("s-obj").onchange = function () { cambiar({ obj: this.value }); };
    ["at-1", "at-7", "at-30"].forEach(function (id) {
      var bt = document.getElementById(id);
      if (bt) bt.onclick = function () { if (bt.dataset.f) cambiar({ a: bt.dataset.f }); };
    });
    var ult = document.getElementById("at-ult");
    if (ult) ult.onclick = function () { cambiar({ b: ult.dataset.f, a: null }); };
    var rant = document.getElementById("r-ant");
    if (rant) rant.onclick = function () { cambiar({ a: d.fecha_anterior_de_b }); };
    var et = document.getElementById("e-todas");
    if (et) et.onclick = function () { estado.evoTodas = !estado.evoTodas; pintar(); };
    Array.prototype.forEach.call(document.querySelectorAll(".comp tbody tr"), function (tr) {
      tr.onclick = function () {
        var r = tr.dataset.r;
        estado.rubro = estado.rubro === r ? null : r;
        estado.detTodos = false;
        guardarHash();
        if (estado.rubro) pedirDetalle(); else pintarDetalleEn();
      };
    });
  }

  pedir();
})();
</script>
</body>
</html>
